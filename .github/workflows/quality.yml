name: Quality

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      # CI only runs schema/type/build checks — it never connects to a DB or
      # boots the server. Non-secret placeholders satisfy readSharedEnv().
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci_placeholder_secret_at_least_32_chars_long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Run lint check
        run: pnpm run lint:check

      - name: Run format check
        run: pnpm run format:check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run build
        run: pnpm run build
